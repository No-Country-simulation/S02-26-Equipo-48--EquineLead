# ============================================================
# ETAPA 1 (MOCK) - HISTÓRICO - NO ELIMINAR
# ============================================================
# Este archivo corresponde a la Etapa 1 del proyecto, donde los
# servicios reales aún no existían y se usaban mocks con nginx.
#
# A partir del Hito 1 (v0.1.0-hito1-local), los servicios reales
# tienen sus propios Dockerfiles y se orquestan desde la raíz:
#   → /docker-compose.yml (Backend C# + Data Science + PostgreSQL)
#
# Solo WAHA (WhatsApp API) sigue activo desde este archivo.
# ============================================================

version: '3.8'

services:
  # ── MOCKS REEMPLAZADOS POR DOCKERFILES REALES (Hito 2) ──────────────────────

  # Mock del Frontend (Puerto 80) → Reemplazado por src/frontend-web (pendiente)
  # mock-frontend:
  #   image: nginx:alpine
  #   container_name: mock-web-frontend
  #   ports:
  #     - "80:80"
  #   restart: always

  # Mock de la API Backend (Puerto 8000) → Reemplazado por src/backend-csharp/Dockerfile
  # mock-backend:
  #   image: nginx:alpine
  #   container_name: mock-api-backend
  #   ports:
  #     - "8000:80"
  #   restart: always

  # Mock del servicio ML (Puerto 8090) → Reemplazado por src/data-science/Dockerfile
  # mock-ml-service:
  #   image: nginx:alpine
  #   container_name: mock-ml-service
  #   ports:
  #     - "8090:80"
  #   restart: always

  # ── ACTIVO: WAHA - WhatsApp HTTP API ────────────────────────────────────────
  # Este servicio permite a Jenkins enviar mensajes de WhatsApp.
  # Sigue activo ya que no forma parte del stack de aplicación principal.
  waha:
    image: devlikeapro/waha
    container_name: equine-lead-waha
    ports:
      - "3005:3000"
    restart: always
    environment:
      - WAHA_LOG_LEVEL=info
      - WAHA_PRINT_QR=true
      # Configuración de acceso para el Dashboard y Swagger
      # Se desactiva la contraseña para facilitar las pruebas en el entorno de mock
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_NO_PASSWORD=true
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_API_KEY=admin
