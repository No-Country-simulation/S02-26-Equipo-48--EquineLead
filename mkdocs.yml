site_name: EquineLead Documentation
site_description: Motor de Crecimiento Basado en Datos para la Industria Ecuestre
site_author: EquineLead Team
repo_url: https://github.com/No-Country-simulation/equine-lead
repo_name: equine-lead

theme:
  name: material
  custom_dir: .docs
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - custom.css

plugins:
  - search
  - mermaid2
  - exclude:
      glob:
        - "**/node_modules/**/*"
        - "**/venv/**/*"
        - "**/__pycache__/**/*"
        - "**/dist/**/*"
        - "**/build/**/*"
        - "**/*.py"
        - "**/*.cs"
        - "**/*.rs"
        - "**/*.sh"
        - "**/*.json"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.toml"
        - "**/*.tf"
        - "**/*.tfvars"
        - "**/*.txt"
        - "**/Makefile"
        - "**/Dockerfile"
        - "**/Jenkinsfile*"
        - "**/.github/**/*"
        - "**/.git/**/*"
        - "**/.idea/**/*"
        - "**/.vscode/**/*"
        - "**/terraform.tfstate*"
        - "**/.terraform/**/*"

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

docs_dir: .docs_staging

nav:
  - "01. Inicio": README.md
  - "02. Infraestructura":
    - "General": infrastructure/README.md
    - "Contenedores y Observabilidad": infrastructure/docker/README.md
    - "Terraform (IaC)": infrastructure/terraform/README.md
    - "Jenkins Module": infrastructure/terraform/modules/jenkins/README.md
    - "App Server Module": infrastructure/terraform/modules/app-server/README.md
  - "03. Testing":
    - "General": tests/README.md
    - "03.1. Scripts": tests/scripts/README.md
    - "03.2. Backend Tests": tests/backend-csharp/README.md
    - "03.3. Data Science Tests": tests/data-science/README.md
    - "03.4. Scrapper Tests": tests/scrapper-rust/README.md
    - "03.5. Frontend Tests": tests/frontend-web/README.md
  - "04. CI/CD & DevOps":
    - "Guía Maestra": ci-cd/README.md
    - "Arquitectura y Visión": ci-cd/docs/01-Arquitectura-y-Vision.md
    - "Flujo Git y Responsabilidades": ci-cd/docs/02-Flujo-Git-y-Responsabilidades.md
    - "Automatización Jenkins": ci-cd/docs/03-Automatizacion-Jenkins.md
    - "05. Jenkins Pipelines":
        - "General": ci-cd/jenkins/README.md
        - "Configuración Paso a Paso": ci-cd/jenkins/CONFIGURACION_PASO_A_PASO.md
        - "Notificaciones WhatsApp": ci-cd/jenkins/NOTIFICACIONES_WHATSAPP.md
  - "05. Componentes (Source)":
    - "Backend C#": src/backend-csharp/README.md
    - "Data Science": src/data-science/README.md
    - "Scrapper Rust": src/scrapper-rust/README.md
    - "Mobile Apps": src/mobile-apps/README.md
    - "Frontend Web": src/frontend-web/README.md
  - "06. Documentación":
    - "01. Onboarding": docs/guides/DEVELOPER_ONBOARDING.md
    - "02. Mapa de Flujo": docs/guides/DOCUMENTATION_FLOW.md
    - "03. Workflow de Git": docs/guides/GIT_WORKFLOW.md
    - "04. Verificación Local": docs/guides/VERIFICACION_LOCAL_DESPLIEGUE.md
    - "05. Referencia Técnica": docs/README.md
    - "06. Base de Datos":
      - "Especificación v2": docs/database/especificacion-tecnica-db-v2.md
      - "Comandos Útiles": docs/database/db-commands.md
    - "07. Contratos y Datos":
      - "Contrato JSON Scoring": docs/data-contracts/contrato-json-scoring-v1.md
      - "Gestión de Datos": docs/data/README.md
    - "08. Reuniones y Bitácoras":
      - "Estándar de Reuniones": docs/meetings/estandar_reuniones.md
      - "Sprint Sync (17-Feb)": docs/meetings/2026-02-17-sprint-sync-mvp-leads.md
      - "Flujo Pipeline Narrado": docs/meetings/2026-02-19-flujo-pipeline-narrado.md
      - "Sprint MVP W2": docs/meetings/2026-02-19-week2out4-sprint-mvp-.md

