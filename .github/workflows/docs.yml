name: Deploy Documentation
on:
  push:
    branches:
      - main
      - dev
      - master
      - feature/devops-automation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
            
      - run: pip install mkdocs-material mkdocs-mermaid2-plugin mkdocs-exclude

      - name: Prepare Staging Directory
        run: |
          mkdir -p .docs_staging
          rsync -av --exclude='.docs_staging' --exclude='.git' --exclude='site' --exclude='venv' --exclude='node_modules' . .docs_staging/
      
      - run: mkdocs gh-deploy --force
